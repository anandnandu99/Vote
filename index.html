<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote to Save</title>
<style>
:root{--bg:#0f111a;--card:#171a27;--text:#f2f4fa;--mut:#8a90a6;--line:#262a3c;--blue:#1e90ff;--pink:#ee0a6e;--dim:.35;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f5fa;--card:#fff;--text:#14172a;--mut:#69708a;--line:#dde0ec;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:8px 0 4px}
.sub{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin:18px 0 6px}
.left{text-align:center;font-size:18px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px}
.c{text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.av{position:relative;width:96px;height:96px;margin:0 auto 8px}
.av .img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;transition:.15s;opacity:var(--dim);filter:grayscale(.5)}
.c.on .img{opacity:1;filter:none}
.badge{position:absolute;top:-4px;right:-8px;background:var(--blue);color:#fff;border-radius:14px;min-width:30px;padding:3px 8px;font-size:15px;font-weight:600}
.nm{font-size:14px;color:var(--mut)}.c.on .nm{color:var(--text)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:16px;color:#fff;font-weight:600;font-size:16px;background:linear-gradient(90deg,var(--blue),var(--pink));cursor:pointer;margin-top:30px}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--text);margin-top:10px;font-size:14px;padding:12px}
.btn.danger{color:#ff6b6b}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-size:14px;cursor:pointer}
nav button.act{color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--blue)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.row .img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.rk{width:22px;text-align:center;font-weight:700;color:var(--mut)}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink))}
.grow{flex:1;min-width:0}.tot{font-weight:700}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
label.file{display:flex;align-items:center;gap:12px;margin:10px 0;color:var(--mut);font-size:14px}
.pv{width:56px;height:56px;border-radius:50%;background:var(--line);object-fit:cover}
.x{background:none;border:0;color:#ff6b6b;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:14px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;cursor:pointer}.chip.act{color:#fff;background:linear-gradient(90deg,var(--blue),var(--pink));border-color:transparent}textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-family:inherit;min-height:90px}.row input[type=text]{border:0;background:transparent;padding:6px}.row label{cursor:pointer;flex:none}.row input[type=file]{display:none}.stat{flex:none;margin-left:auto;align-self:center;font-size:12px;color:var(--mut);padding-left:8px}</style></head><body>
<div class="wrap" id="app"></div>
<nav><button data-t="vote">Vote</button><button data-t="board">Leaderboard</button><button data-t="manage">Manage</button></nav>
<div class="toast" id="toast"></div>
<script src="config.js" onerror="void 0"></script>
<script src="contestants.js" onerror="void 0"></script>
<script>
const KEY='vote-app-v1';
const COLORS=['#7c5cff','#e5484d','#0ea5a4','#d97706','#2563eb','#c026d3','#16a34a','#db2777'];
const CFG=window.VOTE_CONFIG||{},REMOTE=!!(CFG.url&&CFG.key);
const mkid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mkp=n=>({id:mkid('p'),name:n,photo:'',total:0});
let S={cur:'',folders:[]},mine={},tab='vote',draft=null,STAT=REMOTE?'● Connecting':'○ Local only';
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.folders)S=r}catch(e){}
const C=window.CONTESTANTS;
function seedLocal(){
 let f=S.folders.find(x=>x.id===C.id);
 if(!f){f={id:C.id,name:C.folder,limit:C.votes||100,round:0,people:[]};S.folders.unshift(f)}
 C.people.forEach(c=>{let p=f.people.find(x=>x.id===c.id);if(!p){p={id:c.id,total:0};f.people.push(p)}p.name=c.name;p.photo=c.photo||''});
 const ix=p=>{const i=C.people.findIndex(c=>c.id===p.id);return i<0?999:i};
 f.people.sort((a,b)=>ix(a)-ix(b));
 if(!S.cur)S.cur=C.id}
if(!REMOTE){if(C)seedLocal();else if(!S.folders.length)S={cur:'f0',folders:[{id:'f0',name:'Bigg Boss',limit:100,round:0,people:['Prajakta','Tanvi','Sanket','Deepali','Anushri','Reva'].map(mkp)}]}}
const F=()=>S.folders.find(f=>f.id===S.cur)||(S.folders[0]&&(S.cur=S.folders[0].id,S.folders[0]));
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!REMOTE)toast('Could not save (storage full?)')}};
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function setStat(t){STAT=t;const e=document.getElementById('stat');if(e)e.textContent=t}
/* per-device votes used (shared totals live in the database) */
let U={};try{U=JSON.parse(localStorage.getItem('vote-app-used')||'{}')}catch(e){}
const used=f=>{const u=U[f.id];return u&&u.round===(f.round||0)?u.used:0};
const addUsed=(f,n)=>{U[f.id]={round:f.round||0,used:used(f)+n};try{localStorage.setItem('vote-app-used',JSON.stringify(U))}catch(e){}};
const left=()=>F().limit-used(F())-sum(mine);
/* ---------- backend (Supabase REST + Storage) ---------- */
const H=x=>({apikey:CFG.key,Authorization:'Bearer '+CFG.key,...x});
async function R(method,path,body,extra){
 if(!REMOTE)return null;
 try{const r=await fetch(CFG.url+path,{method,headers:H({'Content-Type':'application/json',...extra}),body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error((await r.text()).slice(0,120));
  setStat('● Live');return r}
 catch(e){setStat('○ Offline');toast('Server: '+e.message);return null}}
const MIN={Prefer:'return=minimal'};
async function upload(id,blob){
 try{const path=id+'-'+Date.now()+'.jpg';
  const r=await fetch(CFG.url+'/storage/v1/object/photos/'+path,{method:'POST',headers:H({'Content-Type':'image/jpeg','x-upsert':'true'}),body:blob});
  if(!r.ok)throw new Error((await r.text()).slice(0,120));
  return CFG.url+'/storage/v1/object/public/photos/'+path}
 catch(e){toast('Photo upload: '+e.message);return null}}
function dropPhoto(url){if(!REMOTE||!url||!url.includes('/object/public/photos/'))return;
 fetch(CFG.url+'/storage/v1/object/photos/'+url.split('/object/public/photos/')[1],{method:'DELETE',headers:H({})}).catch(()=>{})}
async function seedRemote(){
 if(!C||!REMOTE)return;
 await R('POST','/rest/v1/folders?on_conflict=id',[{id:C.id,name:C.folder,vote_limit:C.votes||100,round:0}],{Prefer:'resolution=ignore-duplicates,return=minimal'});
 await R('POST','/rest/v1/options?on_conflict=id',C.people.map((c,i)=>({id:c.id,folder_id:C.id,name:c.name,photo_url:c.photo||null,pos:i})),{Prefer:'resolution=merge-duplicates,return=minimal'})}
async function pull(){
 if(!REMOTE)return;
 const a=await R('GET','/rest/v1/folders?select=*&order=created_at'),b=await R('GET','/rest/v1/options?select=*&order=pos,created_at');
 if(!a||!b)return;
 const fs=await a.json(),os=await b.json();
 S.folders=fs.map(f=>({id:f.id,name:f.name,limit:f.vote_limit,round:f.round,people:os.filter(o=>o.folder_id===f.id).map(o=>({id:o.id,name:o.name,photo:o.photo_url||'',total:o.total}))}));
 if(!S.folders.some(f=>f.id===S.cur))S.cur=S.folders[0]?S.folders[0].id:'';
 cache()}
async function refresh(){
 if(!REMOTE)return;
 if(tab==='manage'&&['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName))return;
 const before=JSON.stringify(S.folders);await pull();if(JSON.stringify(S.folders)!==before)render()}
/* ---------- actions: update screen, then store in backend ---------- */
async function opNewFolder(n){const f={id:mkid('f'),name:n,limit:100,round:0,people:[]};S.folders.push(f);S.cur=f.id;mine={};cache();render();
 await R('POST','/rest/v1/folders',{id:f.id,name:n,vote_limit:100,round:0},MIN)}
async function patchFolder(f,local,remote){Object.assign(f,local);cache();render();await R('PATCH','/rest/v1/folders?id=eq.'+f.id,remote,MIN)}
async function opDelFolder(f){S.folders=S.folders.filter(x=>x.id!==f.id);S.cur=S.folders[0]?S.folders[0].id:'';mine={};cache();render();
 await R('DELETE','/rest/v1/folders?id=eq.'+f.id,undefined,MIN);f.people.forEach(p=>dropPhoto(p.photo))}
async function opAdd(f,names,ph){
 const ps=names.map(mkp);if(ph)ps[0].photo=ph.dataUrl;f.people.push(...ps);cache();render();
 if(!REMOTE)return;
 if(ph){toast('Uploading photo…');const u=await upload(ps[0].id,ph.blob);if(u)ps[0].photo=u}
 await R('POST','/rest/v1/options',ps.map(p=>({id:p.id,folder_id:f.id,name:p.name,photo_url:p.photo&&!p.photo.startsWith('data:')?p.photo:null,total:0})),MIN);
 cache();render()}
async function opPhoto(p,ph){const old=p.photo;p.photo=ph.dataUrl;cache();render();
 if(!REMOTE)return;toast('Uploading photo…');
 const u=await upload(p.id,ph.blob);if(!u)return;p.photo=u;
 if(await R('PATCH','/rest/v1/options?id=eq.'+p.id,{photo_url:u},MIN))dropPhoto(old);cache();render()}
async function opRename(p,n){p.name=n;cache();render();await R('PATCH','/rest/v1/options?id=eq.'+p.id,{name:n},MIN)}
async function opDelOption(f,p){f.people=f.people.filter(x=>x.id!==p.id);delete mine[p.id];cache();render();
 await R('DELETE','/rest/v1/options?id=eq.'+p.id,undefined,MIN);dropPhoto(p.photo)}
async function opReset(f){f.people.forEach(p=>p.total=0);f.round=(f.round||0)+1;mine={};cache();render();
 await R('PATCH','/rest/v1/options?folder_id=eq.'+f.id,{total:0},MIN);await R('PATCH','/rest/v1/folders?id=eq.'+f.id,{round:f.round},MIN)}
async function opVote(f,v){
 const fid=f.id,n=sum(v);
 if(REMOTE){if(!await R('POST','/rest/v1/rpc/add_votes',{votes:v}))return false;await pull()}
 else{f.people.forEach(p=>{p.total+=v[p.id]||0});cache()}
 const g=S.folders.find(x=>x.id===fid)||f;addUsed(g,n);return true}
function toPhoto(file,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);const d=c.toDataURL('image/jpeg',.82);c.toBlob(b=>cb({dataUrl:d,blob:b}),'image/jpeg',.82)};im.src=rd.result};rd.readAsDataURL(file)}
/* ---------- UI ---------- */
const fb=el=>{const d=document.createElement('div');d.className=el.className;d.style.background=el.dataset.c;d.textContent=el.dataset.i;el.replaceWith(d)};
function avatar(p,i,cls='img'){return p.photo?`<img class="${cls}" src="${esc(p.photo)}" alt="" data-i="${esc((p.name[0]||'?').toUpperCase())}" data-c="${COLORS[i%COLORS.length]}" onerror="fb(this)">`:`<div class="${cls}" style="background:${COLORS[i%COLORS.length]}">${esc(p.name[0]||'?').toUpperCase()}</div>`}
const chips=()=>`<div class="chips">${S.folders.map(f=>`<button class="chip ${f.id===S.cur?'act':''}" data-f="${f.id}">📁 ${esc(f.name)}</button>`).join('')}<span class="stat" id="stat">${STAT}</span></div>`;
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('act',b.dataset.t===tab));
 const a=document.getElementById('app'),f=F();
 if(!f){
  a.innerHTML=`${chips()}<h1>Welcome</h1><div class="hint" style="text-align:left">Create your first folder to get started.</div><div style="height:14px"></div><input type="text" id="fn" placeholder="Folder name (e.g. Week 1)" maxlength="40"><button class="btn" id="mkf" style="margin-top:10px;padding:12px">Create folder</button>`;
  a.querySelector('#mkf').onclick=()=>{const n=a.querySelector('#fn').value.trim();if(!n)return toast('Enter a folder name');opNewFolder(n)};return}
 if(tab==='vote'){
  a.innerHTML=`${chips()}<h1>${esc(f.name)}</h1><div class="sub">Vote to save your favourite contestant!</div>
  <div class="left"><b>${left()}</b> Votes left</div>
  ${f.people.length?`<div class="grid">${f.people.map((p,i)=>{const m=mine[p.id]||0;return `<div class="c ${m?'on':''}" data-id="${p.id}"><div class="av">${avatar(p,i)}${m?`<span class="badge" data-minus="${p.id}">${m}</span>`:''}</div><div class="nm">${esc(p.name)}</div></div>`}).join('')}</div>`:'<div class="empty">No options in this folder yet. Add some in Manage.</div>'}
  <button class="btn" id="done" ${sum(mine)?'':'disabled'}>Done</button>
  <div class="hint">Tap a photo to add a vote. Tap the blue number to remove one.</div>`;
  a.querySelectorAll('.c').forEach(c=>c.onclick=e=>{
   const id=c.dataset.id;
   if(e.target.dataset.minus){mine[id]=Math.max(0,(mine[id]||0)-1);if(!mine[id])delete mine[id]}
   else if(left()>0)mine[id]=(mine[id]||0)+1;else toast('No votes left');
   render()});
  a.querySelector('#done').onclick=async e=>{e.target.disabled=true;if(await opVote(f,{...mine})===false){render();return}mine={};toast('Votes submitted!');tab='board';render()};
 }
 if(tab==='board'){
  const sorted=[...f.people].sort((x,y)=>y.total-x.total),max=Math.max(1,...sorted.map(p=>p.total)),all=sorted.reduce((s,p)=>s+p.total,0);
  a.innerHTML=`${chips()}<h1>${esc(f.name)} leaderboard</h1><div class="hint" style="text-align:left;margin:0 0 16px">${all} total votes</div>`+
  (sorted.map((p,r)=>`<div class="row"><div class="rk">${r+1}</div>${avatar(p,f.people.indexOf(p))}<div class="grow"><div>${esc(p.name)}</div><div class="bar"><i style="width:${p.total/max*100}%"></i></div></div><div class="tot">${p.total}</div></div>`).join('')||'<div class="empty">Nothing here yet.</div>');
 }
 if(tab==='manage'){
  a.innerHTML=`${chips()}<h1>Manage</h1>
  <div class="sub" style="text-align:left">New folder</div>
  <input type="text" id="fn" placeholder="Folder name (e.g. Week 2)" maxlength="40">
  <button class="btn" id="mkf" style="margin-top:10px;padding:12px">Create folder</button>
  <div class="sub" style="text-align:left;margin-top:28px">Add option to “${esc(f.name)}”</div>
  <input type="text" id="on" placeholder="Name" maxlength="30">
  <label class="file" style="cursor:pointer"><img class="pv" id="pv" alt=""><span>Photo (optional) <input type="file" id="ph" accept="image/*"></span></label>
  <button class="btn" id="add1" style="margin-top:6px;padding:12px">Add option</button>
  <div class="sub" style="text-align:left;margin-top:22px">Or add many (one name per line)</div>
  <textarea id="names" placeholder="Aarav&#10;Meera&#10;Rohan"></textarea>
  <button class="btn sec" id="addn">Add all</button>
  <div class="sub" style="text-align:left;margin-top:28px">Options (tap a circle to change photo)</div>
  ${f.people.map((p,i)=>`<div class="row"><label>${avatar(p,i)}<input type="file" accept="image/*" data-ph="${p.id}"></label><input type="text" class="grow" value="${esc(p.name)}" data-rn="${p.id}" maxlength="30"><button class="x" data-del="${p.id}" aria-label="Delete">&times;</button></div>`).join('')||'<div class="hint">No options yet.</div>'}
  <div class="sub" style="text-align:left;margin-top:28px">Folder settings</div>
  <input type="text" id="tt" value="${esc(f.name)}" placeholder="Folder name">
  <div style="height:10px"></div>
  <input type="number" id="lm" value="${f.limit}" min="1" placeholder="Votes per round">
  <button class="btn sec" id="round">Start new round (refill votes, keep totals)</button>
  <button class="btn sec danger" id="reset">Reset totals in this folder</button>
  <button class="btn sec danger" id="delf">Delete this folder</button>`;
  const q=s=>a.querySelector(s),find=id=>f.people.find(x=>x.id===id);
  q('#mkf').onclick=()=>{const n=q('#fn').value.trim();if(!n)return toast('Enter a folder name');opNewFolder(n)};
  q('#ph').onchange=e=>{const file=e.target.files[0];if(file)toPhoto(file,d=>{draft=d;q('#pv').src=d.dataUrl})};
  q('#add1').onclick=()=>{const n=q('#on').value.trim();if(!n)return toast('Enter a name');const d=draft;draft=null;opAdd(f,[n],d)};
  q('#addn').onclick=()=>{const ns=q('#names').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!ns.length)return toast('Type at least one name');opAdd(f,ns,null)};
  a.querySelectorAll('[data-ph]').forEach(i=>i.onchange=e=>{const p=find(i.dataset.ph),file=e.target.files[0];if(p&&file)toPhoto(file,d=>opPhoto(p,d))});
  a.querySelectorAll('[data-rn]').forEach(i=>i.onchange=()=>{const p=find(i.dataset.rn),n=i.value.trim();if(p&&n)opRename(p,n)});
  a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this option?'))opDelOption(f,find(b.dataset.del))});
  q('#tt').onchange=e=>{const n=e.target.value.trim();if(n)patchFolder(f,{name:n},{name:n})};
  q('#lm').onchange=e=>{const v=Math.max(1,+e.target.value||100);patchFolder(f,{limit:v},{vote_limit:v});toast('Saved')};
  q('#round').onclick=()=>{mine={};patchFolder(f,{round:(f.round||0)+1},{round:(f.round||0)+1});toast('New round started')};
  q('#reset').onclick=()=>{if(confirm('Reset all totals in this folder?')){opReset(f);toast('Totals reset')}};
  q('#delf').onclick=()=>{if(S.folders.length<2)return toast('Keep at least one folder');if(confirm('Delete folder "'+f.name+'" and everything in it?'))opDelFolder(f)};
 }
 a.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.f;mine={};cache();render()});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();refresh()});
render();
if(REMOTE){seedRemote().then(pull).then(render);setInterval(()=>{if(tab==='board')refresh()},8000)}
</script></body></html>
